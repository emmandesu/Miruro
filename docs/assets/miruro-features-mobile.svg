<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="1460" viewBox="0 0 720 1460"><style>text{font-family:Karla,Arial,sans-serif} .title{font-weight:700;fill:#f3f1fa} .body{fill:#b8b4c2} .accent{fill:#bca9ee}</style><rect x="1" y="1" width="718" height="1458" rx="28" fill="#141416" stroke="#39353f" stroke-width="2"/><text x="40" y="70" font-size="39" class="title" >Small touches. Better watching.</text><text x="42" y="111" font-size="24" class="body" >Native tools around Miruro’s website player.</text><rect x="40" y="150" width="640" height="188" rx="18" fill="#1c1b1f" stroke="#44404a"/><rect x="64" y="180" width="66" height="66" rx="18" fill="#302839" stroke="#594b6d"/><g transform="translate(78,194) scale(1.18)" fill="none" stroke="#c6b2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V5a1 1 0 0 1 1-1h7 M28 12V5a1 1 0 0 0-1-1h-7 M4 20v7a1 1 0 0 0 1 1h7 M28 20v7a1 1 0 0 1-1 1h-7 M13 11l8 5-8 5z"/></g><text x="152" y="216" font-size="30" class="title" >Watch in fullscreen</text><text x="152" y="259" font-size="22" class="body" >Landscape, rotation lock &amp; touch lock.</text><text x="152" y="291" font-size="22" class="body" >Controls fade while you’re watching.</text><rect x="40" y="358" width="640" height="188" rx="18" fill="#1c1b1f" stroke="#44404a"/><rect x="64" y="388" width="66" height="66" rx="18" fill="#302839" stroke="#594b6d"/><g transform="translate(78,402) scale(1.18)" fill="none" stroke="#c6b2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3v18 M10 15l6 6 6-6 M5 22v5a1 1 0 0 0 1 1h20a1 1 0 0 0 1-1v-5"/></g><text x="152" y="424" font-size="30" class="title" >Downloads, organized</text><text x="152" y="467" font-size="22" class="body" >Queue episodes. Track progress. Cancel.</text><text x="152" y="499" font-size="22" class="body" >Open saved videos in your own player.</text><rect x="40" y="566" width="640" height="188" rx="18" fill="#1c1b1f" stroke="#44404a"/><rect x="64" y="596" width="66" height="66" rx="18" fill="#302839" stroke="#594b6d"/><g transform="translate(78,610) scale(1.18)" fill="none" stroke="#c6b2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v8c0 7-6 11-11 14C11 26 5 22 5 15V7z M10 15l4 4 8-9"/></g><text x="152" y="632" font-size="30" class="title" >DNS you choose</text><text x="152" y="675" font-size="22" class="body" >NextDNS, AdGuard or System DNS.</text><text x="152" y="707" font-size="22" class="body" >Your choice follows native downloads.</text><rect x="40" y="774" width="640" height="188" rx="18" fill="#1c1b1f" stroke="#44404a"/><rect x="64" y="804" width="66" height="66" rx="18" fill="#302839" stroke="#594b6d"/><g transform="translate(78,818) scale(1.18)" fill="none" stroke="#c6b2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M5 28v-3c0-5 5-8 11-8s11 3 11 8v3"/></g><text x="152" y="840" font-size="30" class="title" >AniList, connected</text><text x="152" y="883" font-size="22" class="body" >Sign in through Miruro’s own website.</text><text x="152" y="915" font-size="22" class="body" >Use its anime list and progress tools.</text><rect x="40" y="982" width="640" height="188" rx="18" fill="#1c1b1f" stroke="#44404a"/><rect x="64" y="1012" width="66" height="66" rx="18" fill="#302839" stroke="#594b6d"/><g transform="translate(78,1026) scale(1.18)" fill="none" stroke="#c6b2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M27 12a12 12 0 0 0-21-4 M5 3v7h7 M5 20a12 12 0 0 0 21 4 M27 29v-7h-7 M16 10v7l5 3"/></g><text x="152" y="1048" font-size="30" class="title" >Updates with context</text><text x="152" y="1091" font-size="22" class="body" >Read what’s new. Download in the app.</text><text x="152" y="1123" font-size="22" class="body" >Confirm installation with Android.</text><rect x="40" y="1190" width="640" height="188" rx="18" fill="#1c1b1f" stroke="#444